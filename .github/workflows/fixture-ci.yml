name: Fixture-only macOS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Git ref to verify (for example, v1.0.0-rc.3)
        required: true
        type: string
      expected_commit_sha:
        description: Full commit SHA expected after checkout
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fixture-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-hygiene:
    name: Release hygiene (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_ref || github.sha }}

      - name: Verify checked-out candidate commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        run: |
          if [[ ! "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_commit_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          actual_commit="$(git rev-parse HEAD)"
          printf 'Expected commit: %s\n' "$EXPECTED_COMMIT_SHA"
          printf 'Checked-out commit: %s\n' "$actual_commit"
          test "$actual_commit" = "$EXPECTED_COMMIT_SHA"

      - name: Verify docs, licenses, paths, secrets, and script syntax
        run: |
          expected_origin="https://github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "$expected_origin"
          test "$(git remote get-url origin)" = "$expected_origin"
          scripts/check-secrets.sh --history

          echo "Running strict release hygiene in an isolated exported-tree harness; live ref identity is verified separately."
          release_tree="$(mktemp -d "$RUNNER_TEMP/agent-loki-release-tree.XXXXXX")"
          git archive --format=tar HEAD | tar -xf - -C "$release_tree"
          candidate_version="$(sed -nE 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' package.json | sed -n '1p')"
          candidate_tag="v${candidate_version}"
          git -C "$release_tree" init --quiet --initial-branch=main
          git -C "$release_tree" config user.name "Agent Loki CI"
          git -C "$release_tree" config user.email "ci@agent-loki.invalid"
          git -C "$release_tree" config commit.gpgsign false
          git -C "$release_tree" config tag.gpgsign false
          git -C "$release_tree" add --force --all
          git -C "$release_tree" commit --quiet -m "Verify exported candidate tree"
          git -C "$release_tree" tag --annotate "$candidate_tag" -m "$candidate_tag"
          "$release_tree/scripts/verify-release.sh" --public-clean-history

  fixture-tests:
    name: Fixture-only build and test
    needs: release-hygiene
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # RC3 was sealed with Xcode 26.6. Select it explicitly instead of
      # inheriting the runner image's moving default.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      LOKI_LIVE_OLLAMA: "0"
      LOKI_P7_LIVE_OLLAMA: "0"
      LOKI_P8_LIVE_OLLAMA: "0"
      LOKI_LIVE_FEED_URL: ""
      ENABLE_ENFORCEMENT: "false"
    steps:
      - name: Check out candidate without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_ref || github.sha }}

      - name: Verify checked-out candidate commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        run: |
          if [[ ! "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_commit_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          actual_commit="$(git rev-parse HEAD)"
          printf 'Expected commit: %s\n' "$EXPECTED_COMMIT_SHA"
          printf 'Checked-out commit: %s\n' "$actual_commit"
          test "$actual_commit" = "$EXPECTED_COMMIT_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Build and test legacy TypeScript runtime
        run: |
          npm run build
          npm test

      - name: Assert pinned native toolchain
        run: |
          xcodebuild -version
          swift --version
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6"

      - name: Build universal native fixture test bundle
        run: |
          xcodebuild \
            -project macos/LokiBrief/LokiBrief.xcodeproj \
            -scheme LokiBrief \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/LokiBriefDerivedData" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_IDENTITY= \
            ONLY_ACTIVE_ARCH=NO \
            'ARCHS=arm64 x86_64' \
            build-for-testing

      # This asynchronous lifecycle fixture has a strict two-second deadline.
      # Run it once in a fresh test host, then run every other fixture once in
      # a second host. Neither invocation retries or ignores a failure.
      - name: Run isolated provider-revocation fixture
        run: |
          xcodebuild \
            -project macos/LokiBrief/LokiBrief.xcodeproj \
            -scheme LokiBrief \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/LokiBriefDerivedData" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_IDENTITY= \
            -parallel-testing-enabled NO \
            -only-testing:LokiBriefTests/LokiChatControllerLifecycleTests/testHistoryOffVaultEvidenceIsScrubbedByRawProviderRevocation \
            test-without-building

      - name: Run remaining native fixture tests
        run: |
          xcodebuild \
            -project macos/LokiBrief/LokiBrief.xcodeproj \
            -scheme LokiBrief \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/LokiBriefDerivedData" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_IDENTITY= \
            -parallel-testing-enabled NO \
            -skip-testing:LokiBriefTests/LokiChatControllerLifecycleTests/testHistoryOffVaultEvidenceIsScrubbedByRawProviderRevocation \
            test-without-building

      - name: Build unsigned universal Release
        run: |
          xcodebuild \
            -project macos/LokiBrief/LokiBrief.xcodeproj \
            -scheme LokiBrief \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/LokiBriefRelease" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_IDENTITY= \
            ONLY_ACTIVE_ARCH=NO \
            'ARCHS=arm64 x86_64' \
            build
