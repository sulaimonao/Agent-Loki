name: Feature request
description: Propose a bounded product improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the problem without private account or content details.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Privacy, security, and authority boundaries
      description: Identify networking, credentials, storage, provider writes, or migration implications.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I understand that a roadmap item or feature request does not authorize implementation or publication.
          required: true
