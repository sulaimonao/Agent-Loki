_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Loki Brief
  description: Read-only selected-channel source authorization for the local Loki Brief macOS app.
  background_color: "#171717"
oauth_config:
  redirect_urls:
    - com.agentloki.lokibrief://oauth/slack
  scopes:
    user:
      - channels:read
      - channels:history
      - groups:read
      - groups:history
      - users:read
  pkce_enabled: true
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
